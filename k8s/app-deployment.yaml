apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-app
  namespace: resume-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-app
  template:
    metadata:
      labels:
        app: resume-app
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["mysql"]
              topologyKey: kubernetes.io/hostname
      containers:
      - name: resume-app
        image: asia-southeast1-docker.pkg.dev/maffindi/resume-app/resume-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        envFrom:
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: uploads
          mountPath: /var/www/html/assets/images
        - name: cloudflare-cert
          mountPath: /etc/ssl/cloudflare
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: app-uploads
      - name: cloudflare-cert
        secret:
          secretName: cloudflare-origin-cert

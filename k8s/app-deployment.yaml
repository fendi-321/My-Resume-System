apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-app
  namespace: resume-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-app
  template:
    metadata:
      labels:
        app: resume-app
    spec:
      containers:
      - name: resume-app
        image: asia-southeast1-docker.pkg.dev/maffindi/resume-app/resume-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: uploads
          mountPath: /var/www/html/assets/images
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: app-uploads
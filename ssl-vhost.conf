<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName maffindi.com
        ServerAlias www.maffindi.com
        DocumentRoot /var/www/html

        SSLEngine on
        SSLCertificateFile /etc/ssl/cloudflare/tls.crt
        SSLCertificateKeyFile /etc/ssl/cloudflare/tls.key

        <Directory /var/www/html>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>
